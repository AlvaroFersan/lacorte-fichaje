# Publica la imagen en GitHub (ghcr.io) para que el NAS la baje de ahí,
# sin Docker Hub. Container Manager pega NAS.yml (imagen lista).
# Si el NAS no puede hablar con ghcr.io, usa docker-compose.yml y construye.

name: Imagen NAS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: imagen-nas
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: Nombre de la imagen
        id: img
        env:
          REPO: ${{ github.repository }}
        run: echo "nombre=ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.img.outputs.nombre }}:latest
            ${{ steps.img.outputs.nombre }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=La Corte Fichaje
            org.opencontainers.image.description=Fichaje y producción para el NAS del estudio
          cache-from: type=gha
          cache-to: type=gha,mode=max
